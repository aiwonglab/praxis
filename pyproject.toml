[project]
name = "praxis"
version = "0.4.0.0"
description = "A research scaffold for clinical AI and data science"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
praxis-answer = "praxis.answer:main"

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["src/praxis/templates"]  # templates hold {{FIELDS}}

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["src/praxis/templates", ".venv"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
