[project]
name = "praxis"
version = "0.1.1"
description = "A research scaffold for clinical AI and data science"
requires-python = ">=3.13"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
